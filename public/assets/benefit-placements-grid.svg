<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 720" width="660" height="720" fill="none">
  <defs>
    <linearGradient id="grid_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B0D13"/>
      <stop offset="100%" stop-color="#141824"/>
    </linearGradient>
    <linearGradient id="card_glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="offer_burst" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0B0D13" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="660" height="720" rx="36" fill="url(#grid_bg)"/>
  <rect width="660" height="720" fill="url(#offer_burst)"/>
  <rect x="1.5" y="1.5" width="657" height="717" rx="34.5" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="120" x2="660" y2="120"/>
    <line x1="0" y1="240" x2="660" y2="240"/>
    <line x1="0" y1="360" x2="660" y2="360"/>
    <line x1="0" y1="480" x2="660" y2="480"/>
    <line x1="0" y1="600" x2="660" y2="600"/>
    <line x1="165" y1="0" x2="165" y2="720"/>
    <line x1="330" y1="0" x2="330" y2="720"/>
    <line x1="495" y1="0" x2="495" y2="720"/>
  </g>

  <!-- Live Recruiter Offers Floating Cards -->
  <!-- Card 1: TCS Prime Offer -->
  <g transform="translate(48, 60)">
    <rect width="260" height="96" rx="20" fill="url(#card_glow)" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="36" cy="38" r="16" fill="#38BDF8" fill-opacity="0.15"/>
    <text x="36" y="43" text-anchor="middle" fill="#38BDF8" font-family="'Inter', sans-serif" font-weight="900" font-size="12">TCS</text>
    <text x="64" y="36" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="700" font-size="15">TCS Prime / Digital</text>
    <text x="64" y="54" fill="#94A3B8" font-family="'Inter', sans-serif" font-weight="500" font-size="12">CTC: 9.0 LPA Offer Letter</text>
    <rect x="24" y="68" width="88" height="18" rx="5" fill="#10B981" fill-opacity="0.2"/>
    <text x="68" y="81" text-anchor="middle" fill="#10B981" font-family="'Inter', sans-serif" font-weight="700" font-size="10">SELECTED • 2026</text>
  </g>

  <!-- Card 2: Infosys Specialist -->
  <g transform="translate(340, 90)">
    <rect width="270" height="96" rx="20" fill="url(#card_glow)" stroke="#818CF8" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="36" cy="38" r="16" fill="#818CF8" fill-opacity="0.15"/>
    <text x="36" y="43" text-anchor="middle" fill="#818CF8" font-family="'Inter', sans-serif" font-weight="900" font-size="12">INF</text>
    <text x="64" y="36" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="700" font-size="15">Infosys Specialist Prog.</text>
    <text x="64" y="54" fill="#94A3B8" font-family="'Inter', sans-serif" font-weight="500" font-size="12">CTC: 9.5 LPA Verified</text>
    <rect x="24" y="68" width="94" height="18" rx="5" fill="#10B981" fill-opacity="0.2"/>
    <text x="71" y="81" text-anchor="middle" fill="#10B981" font-family="'Inter', sans-serif" font-weight="700" font-size="10">ROUND 3 CLEARED</text>
  </g>

  <!-- Card 3: Capgemini Excellence -->
  <g transform="translate(48, 180)">
    <rect width="260" height="96" rx="20" fill="url(#card_glow)" stroke="#0070AD" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="36" cy="38" r="16" fill="#0070AD" fill-opacity="0.2"/>
    <text x="36" y="43" text-anchor="middle" fill="#00C9FF" font-family="'Inter', sans-serif" font-weight="900" font-size="12">CAP</text>
    <text x="64" y="36" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="700" font-size="15">Capgemini Senior Analyst</text>
    <text x="64" y="54" fill="#94A3B8" font-family="'Inter', sans-serif" font-weight="500" font-size="12">CTC: 7.5 LPA Package</text>
    <rect x="24" y="68" width="102" height="18" rx="5" fill="#10B981" fill-opacity="0.2"/>
    <text x="75" y="81" text-anchor="middle" fill="#10B981" font-family="'Inter', sans-serif" font-weight="700" font-size="10">GAME TEST: 100%</text>
  </g>

  <!-- Card 4: Accenture Advance Tech -->
  <g transform="translate(340, 210)">
    <rect width="270" height="96" rx="20" fill="url(#card_glow)" stroke="#A855F7" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="36" cy="38" r="16" fill="#A855F7" fill-opacity="0.2"/>
    <text x="36" y="43" text-anchor="middle" fill="#C084FC" font-family="'Inter', sans-serif" font-weight="900" font-size="14">&gt;</text>
    <text x="64" y="36" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="700" font-size="15">Accenture ASE / FSE</text>
    <text x="64" y="54" fill="#94A3B8" font-family="'Inter', sans-serif" font-weight="500" font-size="12">CTC: 6.5 - 11.5 LPA</text>
    <rect x="24" y="68" width="90" height="18" rx="5" fill="#10B981" fill-opacity="0.2"/>
    <text x="69" y="81" text-anchor="middle" fill="#10B981" font-family="'Inter', sans-serif" font-weight="700" font-size="10">OFFER DISPATCHED</text>
  </g>

  <!-- Central Highlight Badge -->
  <g transform="translate(130, 340)">
    <rect width="400" height="110" rx="24" fill="#0E1726" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>
    <text x="200" y="42" text-anchor="middle" fill="#94A3B8" font-family="'Inter', sans-serif" font-weight="600" font-size="12" letter-spacing="2">ANNUAL CAMPUS DRIVES</text>
    <text x="200" y="78" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="800" font-size="34">94.8% Placement Ratio</text>
  </g>
</svg>