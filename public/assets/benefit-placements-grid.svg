<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 720" width="660" height="720" fill="none">
  <defs>
    <linearGradient id="grid_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="card_glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="center_radial" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="660" height="720" rx="36" fill="url(#grid_bg)"/>
  <rect width="660" height="720" fill="url(#center_radial)"/>
  <rect x="1" y="1" width="658" height="718" rx="35" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- Subtle Blueprint Grid -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="0" y1="140" x2="660" y2="140"/>
    <line x1="0" y1="280" x2="660" y2="280"/>
    <line x1="0" y1="420" x2="660" y2="420"/>
    <line x1="0" y1="560" x2="660" y2="560"/>
    <line x1="220" y1="0" x2="220" y2="720"/>
    <line x1="440" y1="0" x2="440" y2="720"/>
  </g>

  <!-- Card 1: TCS Prime Offer -->
  <g transform="translate(36, 46)">
    <rect width="280" height="106" rx="22" fill="url(#card_glow)" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="38" cy="40" r="18" fill="rgba(56, 189, 248, 0.15)"/>
    <text x="38" y="46" text-anchor="middle" fill="#38BDF8" font-family="'Inter', sans-serif" font-weight="900" font-size="13">TCS</text>
    <text x="68" y="38" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="800" font-size="16">TCS Prime / Digital</text>
    <text x="68" y="58" fill="#94A3B8" font-family="'Inter', sans-serif" font-weight="600" font-size="13">CTC: <tspan fill="#34D399" font-weight="700">₹ 9.0 LPA</tspan> Offer</text>
    <rect x="22" y="74" width="102" height="20" rx="6" fill="rgba(16, 185, 129, 0.2)"/>
    <text x="73" y="88" text-anchor="middle" fill="#34D399" font-family="'Inter', sans-serif" font-weight="700" font-size="10.5">SELECTED • 2026</text>
  </g>

  <!-- Card 2: Infosys Specialist -->
  <g transform="translate(344, 46)">
    <rect width="280" height="106" rx="22" fill="url(#card_glow)" stroke="#818CF8" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="38" cy="40" r="18" fill="rgba(129, 140, 248, 0.15)"/>
    <text x="38" y="46" text-anchor="middle" fill="#818CF8" font-family="'Inter', sans-serif" font-weight="900" font-size="13">INF</text>
    <text x="68" y="38" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="800" font-size="16">Infosys Specialist</text>
    <text x="68" y="58" fill="#94A3B8" font-family="'Inter', sans-serif" font-weight="600" font-size="13">CTC: <tspan fill="#34D399" font-weight="700">₹ 9.5 LPA</tspan> Verified</text>
    <rect x="22" y="74" width="112" height="20" rx="6" fill="rgba(16, 185, 129, 0.2)"/>
    <text x="78" y="88" text-anchor="middle" fill="#34D399" font-family="'Inter', sans-serif" font-weight="700" font-size="10.5">OFFER RELEASED</text>
  </g>

  <!-- Card 3: Capgemini Excellence -->
  <g transform="translate(36, 172)">
    <rect width="280" height="106" rx="22" fill="url(#card_glow)" stroke="#0284C7" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="38" cy="40" r="18" fill="rgba(2, 132, 199, 0.2)"/>
    <text x="38" y="46" text-anchor="middle" fill="#38BDF8" font-family="'Inter', sans-serif" font-weight="900" font-size="13">CAP</text>
    <text x="68" y="38" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="800" font-size="16">Capgemini Senior</text>
    <text x="68" y="58" fill="#94A3B8" font-family="'Inter', sans-serif" font-weight="600" font-size="13">CTC: <tspan fill="#34D399" font-weight="700">₹ 7.5 LPA</tspan> Package</text>
    <rect x="22" y="74" width="118" height="20" rx="6" fill="rgba(16, 185, 129, 0.2)"/>
    <text x="81" y="88" text-anchor="middle" fill="#34D399" font-family="'Inter', sans-serif" font-weight="700" font-size="10.5">GAME TEST: 100%</text>
  </g>

  <!-- Card 4: Accenture Advance -->
  <g transform="translate(344, 172)">
    <rect width="280" height="106" rx="22" fill="url(#card_glow)" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="38" cy="40" r="18" fill="rgba(168, 85, 247, 0.2)"/>
    <text x="38" y="47" text-anchor="middle" fill="#60A5FA" font-family="'Inter', sans-serif" font-weight="900" font-size="16">&gt;</text>
    <text x="68" y="38" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="800" font-size="16">Accenture Adv ASE</text>
    <text x="68" y="58" fill="#94A3B8" font-family="'Inter', sans-serif" font-weight="600" font-size="13">CTC: <tspan fill="#34D399" font-weight="700">₹ 11.5 LPA</tspan> Max</text>
    <rect x="22" y="74" width="118" height="20" rx="6" fill="rgba(16, 185, 129, 0.2)"/>
    <text x="81" y="88" text-anchor="middle" fill="#34D399" font-family="'Inter', sans-serif" font-weight="700" font-size="10.5">DRIVE CLEARED</text>
  </g>

  <!-- Massive Central Placement Ratio Seal -->
  <g transform="translate(90, 316)">
    <rect width="480" height="136" rx="28" fill="#0B1322" stroke="rgba(255, 255, 255, 0.16)" stroke-width="2"/>
    <rect x="2" y="2" width="476" height="132" rx="26" fill="rgba(37, 99, 235, 0.1)"/>
    
    <text x="240" y="44" text-anchor="middle" fill="#38BDF8" font-family="'Inter', sans-serif" font-weight="800" font-size="13" letter-spacing="2.5">ANNUAL CAMPUS DRIVES</text>
    <text x="240" y="86" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="38" letter-spacing="-1">94.8% Placement Ratio</text>
    <text x="240" y="114" text-anchor="middle" fill="#34D399" font-family="'Inter', sans-serif" font-weight="700" font-size="14">1,000+ Students Placed • 50+ Top Hiring Partners</text>
  </g>
</svg>