<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="itBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140f0b"/>
      <stop offset="50%" stop-color="#0e0a07"/>
      <stop offset="100%" stop-color="#080604"/>
    </linearGradient>
    <filter id="itGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="520" rx="28" fill="url(#itBg)" stroke="rgba(245, 158, 11, 0.25)" stroke-width="1.5"/>
  <circle cx="160" cy="120" r="120" fill="#f59e0b" opacity="0.14" filter="url(#itGlow)"/>
  <circle cx="680" cy="400" r="140" fill="#ea580c" opacity="0.12" filter="url(#itGlow)"/>

  <!-- Top Bar -->
  <g transform="translate(32, 28)">
    <circle cx="8" cy="12" r="5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="24" cy="12" r="5" fill="#f97316" opacity="0.8"/>
    <circle cx="40" cy="12" r="5" fill="#fbbf24" opacity="0.8"/>
    <text x="64" y="16" fill="#fcd34d" font-family="'DM Mono', monospace" font-size="12" font-weight="700" letter-spacing="1">IDEATOK // 60s MICRO-PLACEMENT BITES</text>
    
    <rect x="580" y="-4" width="156" height="32" rx="12" fill="rgba(0,0,0,0.5)" stroke="rgba(245,158,11,0.3)"/>
    <circle cx="596" cy="12" r="4" fill="#f59e0b"/>
    <text x="608" y="16" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="700">BITE</text>
    <text x="648" y="17" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800">#24 / 50</text>
  </g>
  <line x1="32" y1="72" x2="768" y2="72" stroke="rgba(255,255,255,0.08)"/>

  <!-- Stacked Card 3 (Background Peek) -->
  <rect x="200" y="96" width="400" height="230" rx="18" fill="#130e0a" stroke="rgba(255,255,255,0.04)" transform="rotate(-3 400 211)" opacity="0.4"/>

  <!-- Stacked Card 2 (Middle Peek) -->
  <rect x="180" y="106" width="440" height="235" rx="18" fill="#17120c" stroke="rgba(245,158,11,0.2)" transform="rotate(2.5 400 223)" opacity="0.75"/>

  <!-- Active Card 1 (Foreground) -->
  <g transform="translate(160, 118)">
    <rect width="480" height="240" rx="18" fill="#1c1610" stroke="rgba(245,158,11,0.4)" stroke-width="1.5"/>
    
    <rect x="20" y="18" width="124" height="22" rx="6" fill="rgba(245,158,11,0.2)" stroke="rgba(245,158,11,0.4)"/>
    <text x="28" y="33" fill="#fcd34d" font-family="sans-serif" font-size="9" font-weight="800">⚡ QUANTS SHORTCUT</text>
    <text x="156" y="34" fill="#94a3b8" font-family="sans-serif" font-size="11">Remainder Theorem</text>
    <text x="440" y="34" text-anchor="end" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="700">★ SAVED</text>

    <text x="20" y="74" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">How to find remainder of 7¹⁰⁰ ÷ 8 in under 3s?</text>

    <!-- Formula Box -->
    <rect x="20" y="92" width="440" height="96" rx="12" fill="rgba(0,0,0,0.5)" stroke="rgba(245,158,11,0.2)"/>
    <text x="36" y="118" fill="#cbd5e1" font-family="sans-serif" font-size="12">Step 1: 7 relative to 8</text>
    <text x="424" y="118" text-anchor="end" fill="#fcd34d" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">7 ≡ -1 (mod 8)</text>

    <text x="36" y="142" fill="#cbd5e1" font-family="sans-serif" font-size="12">Step 2: Raise power to 100</text>
    <text x="424" y="142" text-anchor="end" fill="#fcd34d" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">(-1)¹⁰⁰ = +1</text>

    <line x1="36" y1="154" x2="424" y2="154" stroke="rgba(255,255,255,0.08)"/>
    <text x="36" y="174" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700">➔ Final Remainder =</text>
    <text x="424" y="174" text-anchor="end" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="900">1</text>

    <text x="240" y="218" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-size="10" font-weight="700">⇡ Swipe Up for Next Placement Bite • Tap to Practice</text>
  </g>

  <!-- Bottom Telemetry Strip -->
  <line x1="32" y1="406" x2="768" y2="406" stroke="rgba(255,255,255,0.08)"/>
  <g transform="translate(32, 426)">
    <text x="0" y="16" fill="#64748b" font-family="'DM Mono', monospace" font-size="10" font-weight="700">RETENTION RATE</text>
    <text x="0" y="38" fill="#fcd34d" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="800">94.8% Active</text>

    <text x="368" y="16" text-anchor="middle" fill="#64748b" font-family="'DM Mono', monospace" font-size="10" font-weight="700">DAILY DIGEST</text>
    <text x="368" y="38" text-anchor="middle" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700">16 Bites Consumed</text>

    <text x="736" y="16" text-anchor="end" fill="#64748b" font-family="'DM Mono', monospace" font-size="10" font-weight="700">DAILY GOAL (50 BITES)</text>
    <rect x="626" y="26" width="110" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
    <rect x="626" y="26" width="55" height="6" rx="3" fill="#f59e0b"/>
  </g>
</svg>