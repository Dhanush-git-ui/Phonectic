  <text x="54" y="37" fill="#FFFFFF" fill-opacity="0.7" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="600" font-size="10.5" letter-spacing="0.03em">PREMIER TECH UNIVERSITY</text>
