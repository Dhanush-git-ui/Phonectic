<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 886 560" width="886" height="560" fill="none">
  <defs>
    <linearGradient id="bgHr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#2E1065"/>
    </linearGradient>
  </defs>
  <rect width="886" height="560" rx="48" fill="url(#bgHr)"/>

  <!-- Interview Checklist & Framework Graphic -->
  <g transform="translate(100, 70)">
    <rect width="686" height="360" rx="32" fill="#5B21B6" fill-opacity="0.4" stroke="rgba(192, 132, 252, 0.3)" stroke-width="2"/>
    
    <!-- Top badge -->
    <rect x="40" y="36" width="180" height="36" rx="18" fill="#9333EA"/>
    <text x="60" y="60" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="700">STAR METHOD GUIDE</text>

    <!-- Step S-T-A-R -->
    <g transform="translate(40, 95)">
      <rect x="0" y="0" width="140" height="85" rx="18" fill="#6D28D9"/>
      <text x="20" y="36" fill="#F472B6" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="22" font-weight="900">S</text>
      <text x="20" y="62" fill="#E9D5FF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="600">Situation</text>

      <rect x="155" y="0" width="140" height="85" rx="18" fill="#6D28D9"/>
      <text x="175" y="36" fill="#F472B6" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="22" font-weight="900">T</text>
      <text x="175" y="62" fill="#E9D5FF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="600">Task</text>

      <rect x="310" y="0" width="140" height="85" rx="18" fill="#6D28D9"/>
      <text x="330" y="36" fill="#F472B6" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="22" font-weight="900">A</text>
      <text x="330" y="62" fill="#E9D5FF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="600">Action</text>

      <rect x="465" y="0" width="140" height="85" rx="18" fill="#6D28D9"/>
      <text x="485" y="36" fill="#4ADE80" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="22" font-weight="900">R</text>
      <text x="485" y="62" fill="#DCFCE7" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="600">Result</text>
    </g>

    <!-- Common Mistakes Checklist -->
    <g transform="translate(40, 205)">
      <rect width="606" height="110" rx="20" fill="#4C1D95" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
      <circle cx="34" cy="38" r="12" fill="#EF4444"/>
      <text x="29" y="44" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="900">✕</text>
      <text x="56" y="43" fill="#FCA5A5" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="600">Mistake: Memorized generic answers without real project metrics</text>

      <circle cx="34" cy="74" r="12" fill="#10B981"/>
      <path d="M28 74L32 78L40 70" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <text x="56" y="79" fill="#86EFAC" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="600">Fix: Quantify your impact (e.g. reduced load time by 40%)</text>
    </g>
  </g>

  <!-- Title Bottom -->
  <text x="100" y="495" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="30" font-weight="800" letter-spacing="-0.02em">Cracking Technical HR Rounds: Common Pitfalls</text>
</svg>
