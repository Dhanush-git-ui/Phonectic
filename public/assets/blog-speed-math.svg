<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 886 560" width="886" height="560" fill="none">
  <defs>
    <linearGradient id="bgMath" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
  </defs>
  <rect width="886" height="560" rx="48" fill="url(#bgMath)"/>
  
  <!-- Math Formula Floating Cards -->
  <g transform="translate(100, 70)">
    <!-- Main Board -->
    <rect width="686" height="360" rx="32" fill="#065F46" fill-opacity="0.5" stroke="rgba(52, 211, 153, 0.3)" stroke-width="2"/>
    
    <!-- Top badge -->
    <rect x="40" y="36" width="170" height="36" rx="18" fill="#10B981"/>
    <text x="60" y="60" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="700">SPEED MATH 5X</text>

    <!-- Formula 1 -->
    <rect x="40" y="100" width="280" height="100" rx="20" fill="#047857" fill-opacity="0.8"/>
    <text x="64" y="140" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="700">Vedic Multiplication</text>
    <text x="64" y="174" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="24" font-weight="800">97 × 94 = 9118</text>

    <!-- Formula 2 -->
    <rect x="360" y="100" width="280" height="100" rx="20" fill="#047857" fill-opacity="0.8"/>
    <text x="384" y="140" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="700">Percentages Shortcut</text>
    <text x="384" y="174" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="24" font-weight="800">16% of 50 = 50% of 16</text>

    <!-- Formula 3 -->
    <rect x="40" y="225" width="600" height="90" rx="20" fill="#064E3B" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <text x="64" y="260" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="700">Time &amp; Work Efficiency Ratio</text>
    <text x="64" y="292" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="20" font-weight="700">Solve in 20 seconds without LCM equations</text>
  </g>

  <!-- Title Bottom -->
  <text x="100" y="495" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="30" font-weight="800" letter-spacing="-0.02em">Quantitative Aptitude Speed Shortcuts</text>
</svg>
