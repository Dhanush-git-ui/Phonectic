<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1012" width="1080" height="1012" fill="none">
  <defs>
    <filter id="darkCardGlow" x="0" y="0" width="1080" height="1012" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="40" flood-color="rgba(79, 70, 229, 0.15)" />
    </filter>
    <linearGradient id="barG1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="barG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="floatCardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>

  <!-- Main Chart Container Card -->
  <g filter="url(#darkCardGlow)">
    <rect x="180" y="360" width="760" height="520" rx="48" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    
    <!-- Dotted Target Baseline -->
    <line x1="180" y1="620" x2="940" y2="620" stroke="#0F172A" stroke-width="2" stroke-dasharray="6 6"/>

    <!-- Accuracy Day Bars -->
    <!-- Monday -->
    <rect x="270" y="520" width="36" height="200" rx="18" fill="url(#barG1)"/>
    <rect x="270" y="470" width="36" height="100" rx="18" fill="url(#barG2)"/>
    <text x="274" y="760" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="24" font-weight="600">Mo</text>

    <!-- Tuesday -->
    <rect x="360" y="450" width="36" height="300" rx="18" fill="url(#barG1)"/>
    <rect x="360" y="420" width="36" height="90" rx="18" fill="url(#barG2)"/>
    <text x="366" y="760" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="24" font-weight="600">Tu</text>

    <!-- Wednesday -->
    <rect x="450" y="500" width="36" height="230" rx="18" fill="url(#barG1)"/>
    <rect x="450" y="440" width="36" height="80" rx="18" fill="url(#barG2)"/>
    <text x="452" y="760" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="24" font-weight="600">We</text>

    <!-- Thursday -->
    <rect x="540" y="460" width="36" height="270" rx="18" fill="url(#barG1)"/>
    <rect x="540" y="390" width="36" height="90" rx="18" fill="url(#barG2)"/>
    <text x="546" y="760" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="24" font-weight="600">Th</text>

    <!-- Friday -->
    <rect x="630" y="550" width="36" height="200" rx="18" fill="url(#barG1)"/>
    <rect x="630" y="460" width="36" height="100" rx="18" fill="url(#barG2)"/>
    <text x="638" y="760" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="24" font-weight="600">Fr</text>

    <!-- Saturday -->
    <rect x="720" y="580" width="36" height="150" rx="18" fill="url(#barG1)"/>
    <rect x="720" y="500" width="36" height="90" rx="18" fill="url(#barG2)"/>
    <text x="726" y="760" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="24" font-weight="600">Sa</text>

    <!-- Sunday -->
    <rect x="810" y="430" width="36" height="340" rx="18" fill="url(#barG1)"/>
    <rect x="810" y="390" width="36" height="80" rx="18" fill="url(#barG2)"/>
    <text x="816" y="760" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="24" font-weight="600">Su</text>

    <!-- Current Tag Pill on Right -->
    <g transform="translate(830, 580)">
      <rect width="180" height="74" rx="20" fill="#0F172A"/>
      <circle cx="28" cy="37" r="6" fill="#38BDF8"/>
      <text x="44" y="32" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="600">Score</text>
      <text x="44" y="58" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="22" font-weight="800">98.4 %ile</text>
    </g>
  </g>

  <!-- Top-Left Floating Insight Card -->
  <g transform="translate(100, 160)" filter="url(#darkCardGlow)">
    <rect width="460" height="360" rx="44" fill="url(#floatCardGrad)" stroke="#FFFFFF" stroke-width="2"/>
    <text x="50" y="80" fill="#4338CA" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="26" font-weight="700">Placement Index</text>
    
    <!-- Readiness Tag -->
    <rect x="290" y="55" width="130" height="36" rx="18" fill="rgba(99, 102, 241, 0.15)"/>
    <text x="312" y="79" fill="#2563eb" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="800" letter-spacing="0.05em">READINESS</text>

    <text x="50" y="170" fill="#312E81" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="64" font-weight="900">+64%</text>
    
    <text x="50" y="240" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="19" font-weight="500">Your campus mock test accuracy</text>
    <text x="50" y="270" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="19" font-weight="500">is projected to clear Tier-1 cutoffs.</text>
  </g>
</svg>
