<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 532 440" width="532" height="440" fill="none">
  <defs>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="rgba(37, 99, 235, 0.18)" />
    </filter>
    <filter id="hubGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="rgba(15, 23, 42, 0.25)" />
    </filter>
    <filter id="pillShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="rgba(0, 0, 0, 0.12)" />
    </filter>

    <linearGradient id="quantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="logicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="verbalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="codingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="centerHubGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Ambient background glow -->
  <circle cx="266" cy="220" r="170" fill="rgba(59, 130, 246, 0.05)" />

  <!-- The Donut Ring Structure with crisp stroke separation -->
  <g filter="url(#softGlow)">
    <!-- Arc 1: Quantitative Aptitude (35%) Top-Right -->
    <path d="M 266 50 A 170 170 0 0 1 436 220 L 376 220 A 110 110 0 0 0 266 110 Z" fill="url(#quantGrad)" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Arc 2: Logical Reasoning (28%) Bottom-Right -->
    <path d="M 436 220 A 170 170 0 0 1 295 387 L 285 328 A 110 110 0 0 0 376 220 Z" fill="url(#logicGrad)" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>

    <!-- Arc 3: Verbal Ability (19%) Bottom-Left -->
    <path d="M 295 387 A 170 170 0 0 1 128 322 L 177 286 A 110 110 0 0 0 285 328 Z" fill="url(#verbalGrad)" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>

    <!-- Arc 4: Coding & DSA (18%) Top-Left -->
    <path d="M 128 322 A 170 170 0 0 1 266 50 L 266 110 A 110 110 0 0 0 177 286 Z" fill="url(#codingGrad)" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- Center Hub: Glowing High-Tech Analytics Badge -->
  <g filter="url(#hubGlow)">
    <circle cx="266" cy="220" r="74" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="266" cy="220" r="66" fill="url(#centerHubGrad)"/>
    <circle cx="266" cy="220" r="64" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" fill="none"/>
    
    <!-- Percentile Text -->
    <text x="266" y="206" text-anchor="middle" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="10" font-weight="800" letter-spacing="1.5">NATIONAL RANK</text>
    <text x="266" y="234" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="24" font-weight="900" letter-spacing="-0.5">99.4<tspan font-size="14" font-weight="700" fill="#94A3B8">%ile</tspan></text>
    <text x="266" y="250" text-anchor="middle" fill="#34D399" font-family="'Inter', sans-serif" font-size="9" font-weight="700">TIER-1 CUTOFF ✓</text>
  </g>

  <!-- 1. Quants Badge (Top Right) -->
  <g transform="translate(390, 80)" filter="url(#pillShadow)">
    <rect width="124" height="48" rx="24" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.5"/>
    <circle cx="26" cy="24" r="16" fill="#EFF6FF"/>
    <text x="26" y="29" text-anchor="middle" fill="#2563EB" font-family="'Inter', monospace" font-size="15" font-weight="900">∑</text>
    <text x="50" y="21" fill="#0F172A" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Quants 35%</text>
    <text x="50" y="35" fill="#64748B" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Speed Math 99%</text>
  </g>

  <!-- 2. Logical Reasoning Badge (Bottom Right) -->
  <g transform="translate(380, 310)" filter="url(#pillShadow)">
    <rect width="134" height="48" rx="24" fill="#FFFFFF" stroke="#D1FAE5" stroke-width="1.5"/>
    <circle cx="26" cy="24" r="16" fill="#ECFDF5"/>
    <path d="M26 18V30M20 24H32" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
    <text x="50" y="21" fill="#0F172A" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Logical 28%</text>
    <text x="50" y="35" fill="#059669" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Puzzles Mastered</text>
  </g>

  <!-- 3. Verbal Ability Badge (Bottom Left) -->
  <g transform="translate(20, 340)" filter="url(#pillShadow)">
    <rect width="128" height="48" rx="24" fill="#FFFFFF" stroke="#EDE9FE" stroke-width="1.5"/>
    <circle cx="26" cy="24" r="16" fill="#F5F3FF"/>
    <text x="26" y="30" text-anchor="middle" fill="#2563EB" font-family="Georgia, serif" font-size="16" font-weight="900">“A”</text>
    <text x="50" y="21" fill="#0F172A" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Verbal 19%</text>
    <text x="50" y="35" fill="#2563EB" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Grammar &amp; Vocab</text>
  </g>

  <!-- 4. Coding & DSA Badge (Top Left) -->
  <g transform="translate(15, 90)" filter="url(#pillShadow)">
    <rect width="134" height="48" rx="24" fill="#FFFFFF" stroke="#CFFAFE" stroke-width="1.5"/>
    <circle cx="26" cy="24" r="16" fill="#ECFEFF"/>
    <text x="26" y="29" text-anchor="middle" fill="#0284C7" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="900">&lt;/&gt;</text>
    <text x="50" y="21" fill="#0F172A" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Tech DSA 18%</text>
    <text x="50" y="35" fill="#0284C7" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Company Codes</text>
  </g>
</svg>
