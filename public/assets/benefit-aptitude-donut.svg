<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 532 440" width="532" height="440" fill="none">
  <defs>
    <filter id="donutShadow" x="0" y="0" width="532" height="440" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="rgba(37, 99, 235, 0.12)" />
    </filter>
    <filter id="pillGlow" x="0" y="0" width="100" height="60" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0, 0, 0, 0.2)" />
    </filter>
    <linearGradient id="quantGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="logicGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="verbalGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="codingGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <g filter="url(#donutShadow)">
    <!-- Arc 1: Quantitative Aptitude (35%) Top-Right -->
    <path d="M266 40 A180 180 0 0 1 446 220 L376 220 A110 110 0 0 0 266 110 Z" fill="url(#quantGrad)" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Arc 2: Logical Reasoning (28%) Bottom-Right -->
    <path d="M446 220 A180 180 0 0 1 290 398 L280 328 A110 110 0 0 0 376 220 Z" fill="url(#logicGrad)" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>

    <!-- Arc 3: Verbal Ability (19%) Bottom-Left -->
    <path d="M290 398 A180 180 0 0 1 120 320 L176 278 A110 110 0 0 0 280 328 Z" fill="url(#verbalGrad)" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>

    <!-- Arc 4: Coding & DSA (18%) Top-Left -->
    <path d="M120 320 A180 180 0 0 1 266 40 L266 110 A110 110 0 0 0 176 278 Z" fill="url(#codingGrad)" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- Center Hub -->
  <circle cx="266" cy="220" r="32" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="266" cy="220" r="16" fill="#0F172A"/>
  <circle cx="266" cy="220" r="6" fill="#FFFFFF"/>

  <!-- Icon 1: Quants (Pi / Calculator) -->
  <g transform="translate(345, 110)">
    <text x="0" y="24" fill="#FFFFFF" font-family="'Courier New', monospace, sans-serif" font-size="28" font-weight="900">∑</text>
  </g>
  <!-- Badge 1: 35% -->
  <g transform="translate(410, 115)">
    <rect width="84" height="34" rx="17" fill="rgba(30, 41, 59, 0.75)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.5"/>
    <text x="18" y="23" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="700">35%</text>
  </g>

  <!-- Icon 2: Logical (Puzzle/Brain) -->
  <g transform="translate(365, 290)">
    <circle cx="12" cy="12" r="10" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M12 7V17M7 12H17" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Badge 2: 28% -->
  <g transform="translate(380, 270)">
    <rect width="84" height="34" rx="17" fill="rgba(30, 41, 59, 0.75)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.5"/>
    <text x="18" y="23" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="700">28%</text>
  </g>

  <!-- Icon 3: Verbal (Book/Quote) -->
  <g transform="translate(180, 320)">
    <text x="0" y="24" fill="#FFFFFF" font-family="Georgia, serif" font-size="26" font-weight="700">“A”</text>
  </g>
  <!-- Badge 3: 19% -->
  <g transform="translate(110, 360)">
    <rect width="84" height="34" rx="17" fill="rgba(30, 41, 59, 0.75)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.5"/>
    <text x="18" y="23" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="700">19%</text>
  </g>

  <!-- Icon 4: Coding (Brackets) -->
  <g transform="translate(160, 160)">
    <text x="0" y="22" fill="#38BDF8" font-family="'Courier New', monospace" font-size="24" font-weight="900">&lt;/&gt;</text>
  </g>
  <!-- Badge 4: 18% -->
  <g transform="translate(50, 140)">
    <rect width="84" height="34" rx="17" fill="rgba(30, 41, 59, 0.75)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.5"/>
    <text x="18" y="23" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="700">18%</text>
  </g>
</svg>
