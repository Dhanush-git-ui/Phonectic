<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 532 440" width="532" height="440" fill="none">
  <defs>
    <linearGradient id="code_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="code_card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="accepted_glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#022C22" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Card Frame with high-contrast subtle border -->
  <rect width="532" height="440" rx="32" fill="url(#code_bg)"/>
  <rect x="1" y="1" width="530" height="438" rx="31" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- Code Window Header -->
  <rect x="20" y="20" width="492" height="42" rx="14" fill="#1F2937" fill-opacity="0.6" stroke="rgba(255, 255, 255, 0.08)"/>
  
  <!-- Mac Window Dots -->
  <circle cx="44" cy="41" r="6" fill="#EF4444"/>
  <circle cx="64" cy="41" r="6" fill="#F59E0B"/>
  <circle cx="84" cy="41" r="6" fill="#10B981"/>

  <!-- Tabs -->
  <rect x="110" y="28" width="130" height="26" rx="8" fill="#111827"/>
  <text x="175" y="45" text-anchor="middle" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">solution.cpp</text>
  <text x="260" y="45" fill="#6B7280" font-family="'JetBrains Mono', monospace" font-size="11">solution.py</text>
  <text x="340" y="45" fill="#6B7280" font-family="'JetBrains Mono', monospace" font-size="11">Solution.java</text>
  
  <!-- Runtime Badge in Header -->
  <rect x="424" y="29" width="80" height="24" rx="12" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
  <text x="464" y="45" text-anchor="middle" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">0ms • 100%</text>

  <!-- Code Editor Body -->
  <rect x="20" y="72" width="492" height="236" rx="16" fill="url(#code_card)" stroke="rgba(255, 255, 255, 0.06)"/>
  
  <!-- Code Lines -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12.5" font-weight="500">
    <!-- Line numbers -->
    <text x="40" y="104" fill="#4B5563">1</text>
    <text x="40" y="128" fill="#4B5563">2</text>
    <text x="40" y="152" fill="#4B5563">3</text>
    <text x="40" y="176" fill="#4B5563">4</text>
    <text x="40" y="200" fill="#4B5563">5</text>
    <text x="40" y="224" fill="#4B5563">6</text>
    <text x="40" y="248" fill="#4B5563">7</text>
    <text x="40" y="272" fill="#4B5563">8</text>

    <!-- Syntax Highlighted Code -->
    <text x="74" y="104"><tspan fill="#F43F5E">int</tspan> <tspan fill="#60A5FA">maxProfit</tspan><tspan fill="#E5E7EB">(</tspan><tspan fill="#FBBF24">vector</tspan><tspan fill="#E5E7EB">&lt;</tspan><tspan fill="#F43F5E">int</tspan><tspan fill="#E5E7EB">&gt;&amp; prices) {</tspan></text>
    <text x="74" y="128"><tspan fill="#E5E7EB">    </tspan><tspan fill="#F43F5E">int</tspan> <tspan fill="#E5E7EB">minP = INT_MAX, maxProfit = </tspan><tspan fill="#34D399">0</tspan><tspan fill="#E5E7EB">;</tspan></text>
    <text x="74" y="152"><tspan fill="#E5E7EB">    </tspan><tspan fill="#F43F5E">for</tspan> <tspan fill="#E5E7EB">(</tspan><tspan fill="#F43F5E">int</tspan> <tspan fill="#E5E7EB">p : prices) {</tspan></text>
    <text x="74" y="176"><tspan fill="#E5E7EB">        minP = </tspan><tspan fill="#A78BFA">min</tspan><tspan fill="#E5E7EB">(minP, p);</tspan></text>
    <text x="74" y="200"><tspan fill="#E5E7EB">        maxProfit = </tspan><tspan fill="#A78BFA">max</tspan><tspan fill="#E5E7EB">(maxProfit, p - minP);</tspan></text>
    <text x="74" y="224"><tspan fill="#E5E7EB">    }</tspan></text>
    <text x="74" y="248"><tspan fill="#E5E7EB">    </tspan><tspan fill="#F43F5E">return</tspan> <tspan fill="#E5E7EB">maxProfit;</tspan></text>
    <text x="74" y="272"><tspan fill="#E5E7EB">}</tspan></text>
  </g>

  <!-- Execution Result Card (Glowing Green Placement Acceptance) -->
  <rect x="20" y="318" width="492" height="102" rx="18" fill="url(#accepted_glow)" stroke="#10B981" stroke-opacity="0.4" stroke-width="1.5"/>
  
  <circle cx="56" cy="354" r="18" fill="#10B981" fill-opacity="0.25"/>
  <path d="M48 354 L54 360 L65 348" stroke="#34D399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <text x="88" y="350" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="800" font-size="16">Accepted • Passed 52/52 Test Cases</text>
  <text x="88" y="372" fill="#9CA3AF" font-family="'Inter', sans-serif" font-weight="500" font-size="13">Runtime: <tspan fill="#34D399" font-weight="700">0 ms (Beats 100.0%)</tspan> | Memory: <tspan fill="#E5E7EB">13.2 MB (O(1))</tspan></text>

  <!-- Placement Recruiter Assessment Tags -->
  <g transform="translate(88, 386)">
    <rect x="0" y="0" width="86" height="22" rx="6" fill="rgba(255, 255, 255, 0.1)"/>
    <text x="43" y="15" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700">Amazon OA</text>

    <rect x="94" y="0" width="108" height="22" rx="6" fill="rgba(255, 255, 255, 0.1)"/>
    <text x="148" y="15" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700">TCS Digital 9 LPA</text>

    <rect x="210" y="0" width="100" height="22" rx="6" fill="rgba(255, 255, 255, 0.1)"/>
    <text x="260" y="15" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700">Infosys SP Round</text>
  </g>
</svg>