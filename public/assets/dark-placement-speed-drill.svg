  <line x1="32" y1="392" x2="768" y2="392" stroke="rgba(255,255,255,0.08)"/>
  <g transform="translate(32, 412)">
    <text x="0" y="16" fill="#64748b" font-family="'DM Mono', monospace" font-size="10" font-weight="700">NATIONAL BENCHMARK</text>
    <text x="0" y="38" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="800">Top 0.8%</text>

    <text x="368" y="16" text-anchor="middle" fill="#64748b" font-family="'DM Mono', monospace" font-size="10" font-weight="700">DRILL ACCURACY</text>
    <text x="368" y="38" text-anchor="middle" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="800">99.4% <tspan font-size="12" fill="#10b981">(+4.2%)</tspan></text>

    <text x="736" y="16" text-anchor="end" fill="#64748b" font-family="'DM Mono', monospace" font-size="10" font-weight="700">PACE (TARGET: 2.0s)</text>
