    <rect x="564" y="0" width="172" height="66" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="650" y="24" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="700">OPTION D</text>
    <text x="650" y="50" text-anchor="middle" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700">1,032</text>
