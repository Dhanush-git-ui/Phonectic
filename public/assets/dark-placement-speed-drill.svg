    <text x="10" y="15" fill="#ffffff" font-family="'DM Mono', monospace" font-size="11" font-weight="700">18 of 25</text>
    <text x="80" y="16" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">• TCS Prime Benchmark</text>
    
    <rect x="614" y="0" width="122" height="24" rx="12" fill="rgba(245,158,11,0.15)" stroke="rgba(245,158,11,0.3)"/>
