      <stop offset="0%" stop-color="#0c0f17"/>
      <stop offset="50%" stop-color="#090c14"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <filter id="smGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="520" rx="28" fill="url(#smBg)" stroke="rgba(6, 182, 212, 0.25)" stroke-width="1.5"/>
  <circle cx="160" cy="120" r="120" fill="#2563eb" opacity="0.12" filter="url(#smGlow)"/>
  <circle cx="680" cy="400" r="140" fill="#10b981" opacity="0.1" filter="url(#smGlow)"/>

  <!-- Top Bar -->
