    <text x="462" y="24" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="700">OPTION C</text>
    <text x="462" y="50" text-anchor="middle" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700">1,064</text>

