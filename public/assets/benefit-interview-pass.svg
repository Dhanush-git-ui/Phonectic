<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 551" width="480" height="551" fill="none">
  <defs>
    <filter id="shieldShadow" x="0" y="0" width="480" height="551" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="rgba(15, 23, 42, 0.12)" />
    </filter>
    <linearGradient id="shieldBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>

  <!-- Top Shield Floating Badge -->
  <g transform="translate(195, 30)">
    <path d="M45 10C65 10 90 2 90 2V45C90 70 55 90 45 95C35 90 0 70 0 45V2C0 2 25 10 45 10Z" fill="#0F172A"/>
    <!-- Checkmark inside shield -->
    <path d="M28 46L40 58L64 34" stroke="#38BDF8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Dark Top Rounded Card Header -->
  <g filter="url(#shieldShadow)">
    <rect x="36" y="160" width="408" height="360" rx="36" fill="#0A192F"/>

    <!-- Header Content -->
    <g transform="translate(64, 185)">
      <!-- Phonectic Icon -->
      <rect x="0" y="2" width="36" height="36" rx="10" fill="#2563EB"/>
      <text x="10" y="27" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="900">P</text>
      
      <text x="48" y="27" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="20" font-weight="700">Interview Ready</text>
      
      <!-- Chevron -->
      <path d="M320 20L328 28L336 20" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Inner White Card -->
    <rect x="36" y="235" width="408" height="285" rx="36" fill="#FFFFFF"/>
    
    <text x="64" y="280" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="22" font-weight="700">Placement Assessment</text>
    <text x="64" y="306" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="500">Readiness Score: 98/100</text>

    <!-- Verified Pill -->
    <rect x="310" y="270" width="94" height="32" rx="16" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
    <text x="328" y="291" fill="#2563EB" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="700">Verified ✓</text>

    <line x1="64" y1="334" x2="416" y2="334" stroke="#F1F5F9" stroke-width="1.5"/>

    <!-- Row 1: Aptitude & Speed Math -->
    <g transform="translate(64, 350)">
      <circle cx="20" cy="20" r="18" fill="#F0FDF4"/>
      <path d="M14 20L18 24L26 16" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="50" y="26" fill="#1E293B" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="600">Speed Math &amp; Quants</text>
      <text x="270" y="26" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="700">99.2 %ile</text>
    </g>

    <!-- Row 2: Mock Interview & HR -->
    <g transform="translate(64, 410)">
      <circle cx="20" cy="20" r="18" fill="#EFF6FF"/>
      <circle cx="20" cy="20" r="8" fill="none" stroke="#2563EB" stroke-width="2.5"/>
      <text x="50" y="26" fill="#1E293B" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="600">Technical Interview</text>
      <text x="270" y="26" fill="#059669" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="700">Grade: A+</text>
    </g>

    <!-- Row 3: Technical Coding -->
    <g transform="translate(64, 470)">
      <circle cx="20" cy="20" r="18" fill="#FAF5FF"/>
      <path d="M15 16L11 20L15 24M25 16L29 20L25 24" stroke="#9333EA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="50" y="26" fill="#1E293B" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="600">DSA &amp; System Coding</text>
      <text x="270" y="26" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="700">100 / 100</text>
    </g>
  </g>
</svg>
