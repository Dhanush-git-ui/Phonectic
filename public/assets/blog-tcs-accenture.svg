    <!-- Cutoff Pill -->
    <rect x="40" y="360" width="380" height="100" rx="24" fill="#9333EA" fill-opacity="0.2" stroke="#9333EA" stroke-width="1.5"/>
    <text x="70" y="405" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="700">ASE / FSE ROLE CUTOFF</text>
    <text x="70" y="438" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="24" font-weight="800">Sectional Cutoffs Enabled</text>
  </g>

  <!-- Title Bottom -->
  <text x="140" y="770" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="36" font-weight="800" letter-spacing="-0.02em">Complete Exam Pattern &amp; Strategy Breakdown</text>
