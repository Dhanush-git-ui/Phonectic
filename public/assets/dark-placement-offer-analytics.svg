<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 944 870" width="100%" height="100%">
  <defs>
    <linearGradient id="bgOffer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="60%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glassCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.8)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.9)"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="944" height="870" rx="44" fill="url(#bgOffer)"/>
  <rect width="942" height="868" x="1" y="1" rx="43" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>

  <!-- Decorative ambient lights -->
  <circle cx="820" cy="180" r="160" fill="#3b82f6" opacity="0.16" filter="url(#softGlow)"/>
  <circle cx="140" cy="740" r="150" fill="#10b981" opacity="0.12" filter="url(#softGlow)"/>

  <!-- Official Offer Header -->
  <g transform="translate(48, 48)">
    <rect width="848" height="64" rx="20" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)"/>
    
    <circle cx="36" cy="32" r="14" fill="#10b981"/>
    <path d="M30 32 l4 4 l8 -8" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <text x="64" y="38" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="16" font-weight="800" letter-spacing="0.5">OFFICIAL CAMPUS RECRUITMENT OFFER</text>
    
    <rect x="670" y="16" width="158" height="32" rx="16" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.3)"/>
    <text x="686" y="37" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">✓ VERIFIED SELECTION</text>
  </g>

  <!-- Big Hero Package Card -->
  <g transform="translate(48, 136)">
    <rect width="848" height="240" rx="28" fill="url(#glassCard)" stroke="rgba(59, 130, 246, 0.25)"/>
    
    <!-- Left: CTC and Role -->
    <text x="44" y="52" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1">FULL-TIME COMPENSATION (CTC)</text>
    <text x="44" y="116" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="54" font-weight="900" letter-spacing="-1">₹18,50,000 <tspan fill="#38bdf8" font-size="28" font-weight="700">/ yr</tspan></text>
    <text x="44" y="152" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="18" font-weight="600">Software Development Engineer (SDE-1) • Product Core</text>

    <!-- Badges Row -->
    <g transform="translate(44, 180)">
      <rect x="0" y="0" width="130" height="32" rx="16" fill="rgba(255, 255, 255, 0.08)"/>
      <text x="14" y="21" fill="#f1f5f9" font-size="12" font-weight="700">Tier-1 Company</text>

      <rect x="142" y="0" width="150" height="32" rx="16" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.3)"/>
      <text x="156" y="21" fill="#60a5fa" font-size="12" font-weight="700">Hyderabad Campus</text>

      <rect x="304" y="0" width="168" height="32" rx="16" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.3)"/>
      <text x="318" y="21" fill="#34d399" font-size="12" font-weight="700">Letter of Intent Issued</text>
    </g>

    <!-- Right: Verified Seal Stamp -->
    <g transform="translate(680, 110)">
      <circle cx="0" cy="0" r="62" fill="rgba(245, 158, 11, 0.08)" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="8 4"/>
      <circle cx="0" cy="0" r="50" fill="rgba(245, 158, 11, 0.12)"/>
      <text x="0" y="-8" text-anchor="middle" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" letter-spacing="1">OFFER</text>
      <text x="0" y="10" text-anchor="middle" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" letter-spacing="1">CONFIRMED</text>
      <text x="0" y="26" text-anchor="middle" fill="#fcd34d" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">TOP 1%</text>
    </g>
  </g>

  <!-- Round-By-Round Evaluation Grid -->
  <g transform="translate(48, 404)">
    <text x="0" y="24" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="1">SELECTION ROUNDS BREAKDOWN</text>

    <!-- Round 1: OA -->
    <g transform="translate(0, 44)">
      <rect width="268" height="240" rx="24" fill="url(#glassCard)" stroke="rgba(255, 255, 255, 0.08)"/>
      
      <rect x="20" y="20" width="70" height="24" rx="12" fill="rgba(59, 130, 246, 0.15)"/>
      <text x="30" y="36" fill="#60a5fa" font-size="11" font-weight="700">ROUND 1</text>

      <text x="20" y="74" fill="#ffffff" font-size="18" font-weight="800">Aptitude &amp; Quants</text>
      <text x="20" y="96" fill="#94a3b8" font-size="12">National OA Evaluation</text>

      <text x="20" y="152" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="36" font-weight="900">99.8%</text>
      <text x="20" y="174" fill="#64748b" font-size="12">Score: 48 / 50 questions</text>

      <rect x="20" y="194" width="228" height="26" rx="8" fill="rgba(16, 185, 129, 0.12)"/>
      <text x="32" y="211" fill="#34d399" font-size="11" font-weight="700">✓ Cleared Cutoff (Rank 12)</text>
    </g>

    <!-- Round 2: DSA -->
    <g transform="translate(290, 44)">
      <rect width="268" height="240" rx="24" fill="url(#glassCard)" stroke="rgba(255, 255, 255, 0.08)"/>
      
      <rect x="20" y="20" width="70" height="24" rx="12" fill="rgba(168, 85, 247, 0.15)"/>
      <text x="30" y="36" fill="#60a5fa" font-size="11" font-weight="700">ROUND 2</text>

      <text x="20" y="74" fill="#ffffff" font-size="18" font-weight="800">Technical &amp; DSA</text>
      <text x="20" y="96" fill="#94a3b8" font-size="12">Live Coding &amp; DP Algorithms</text>

      <text x="20" y="152" fill="#60a5fa" font-family="-apple-system, sans-serif" font-size="36" font-weight="900">100%</text>
      <text x="20" y="174" fill="#64748b" font-size="12">All 14 Testcases Passed</text>

      <rect x="20" y="194" width="228" height="26" rx="8" fill="rgba(16, 185, 129, 0.12)"/>
      <text x="32" y="211" fill="#34d399" font-size="11" font-weight="700">✓ O(N) Optimal Solution</text>
    </g>

    <!-- Round 3: Mock Interview -->
    <g transform="translate(580, 44)">
      <rect width="268" height="240" rx="24" fill="url(#glassCard)" stroke="rgba(255, 255, 255, 0.08)"/>
      
      <rect x="20" y="20" width="70" height="24" rx="12" fill="rgba(245, 158, 11, 0.15)"/>
      <text x="30" y="36" fill="#fbbf24" font-size="11" font-weight="700">ROUND 3</text>

      <text x="20" y="74" fill="#ffffff" font-size="18" font-weight="800">HR &amp; Leadership</text>
      <text x="20" y="96" fill="#94a3b8" font-size="12">Mentor Mock Calibration</text>

      <text x="20" y="152" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="36" font-weight="900">9.8/10</text>
      <text x="20" y="174" fill="#64748b" font-size="12">Communication: Outstanding</text>

      <rect x="20" y="194" width="228" height="26" rx="8" fill="rgba(16, 185, 129, 0.12)"/>
      <text x="32" y="211" fill="#34d399" font-size="11" font-weight="700">✓ Strongly Recommended</text>
    </g>
  </g>

  <!-- Bottom Mentor Verification Footer -->
  <g transform="translate(48, 730)">
    <rect width="848" height="88" rx="22" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.07)"/>
    
    <circle cx="48" cy="44" r="22" fill="#1e293b" stroke="#3b82f6"/>
    <text x="40" y="50" fill="#60a5fa" font-size="16" font-weight="800">SK</text>

    <text x="86" y="38" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Placement Mentor Verified: Santhosh Kumar Ananta</text>
    <text x="86" y="58" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Training Lead, Phonectic • 10,000+ Students Mentored Across Hyderabad</text>

    <rect x="710" y="28" width="118" height="32" rx="16" fill="rgba(59, 130, 246, 0.15)"/>
    <text x="724" y="49" fill="#60a5fa" font-size="12" font-weight="700">AIR #1 READY</text>
  </g>
</svg>