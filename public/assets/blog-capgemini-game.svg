<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 886 560" width="886" height="560" fill="none">
  <defs>
    <linearGradient id="bgCap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="gridGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  <rect width="886" height="560" rx="48" fill="url(#bgCap)"/>
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.15" stroke="#FFFFFF" stroke-width="1.5">
    <line x1="120" y1="0" x2="120" y2="560"/>
    <line x1="240" y1="0" x2="240" y2="560"/>
    <line x1="360" y1="0" x2="360" y2="560"/>
    <line x1="480" y1="0" x2="480" y2="560"/>
    <line x1="600" y1="0" x2="600" y2="560"/>
    <line x1="720" y1="0" x2="720" y2="560"/>
    <line x1="0" y1="140" x2="886" y2="140"/>
    <line x1="0" y1="280" x2="886" y2="280"/>
    <line x1="0" y1="420" x2="886" y2="420"/>
  </g>

  <!-- Game Zone Mockup Graphic -->
  <g transform="translate(180, 80)">
    <!-- Game Board -->
    <rect width="526" height="340" rx="28" fill="#1E293B" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    
    <!-- Top Bar -->
    <rect x="24" y="24" width="160" height="34" rx="17" fill="#2563EB"/>
    <text x="44" y="47" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="700">LEVEL 4 · GRID 4x4</text>
    <text x="360" y="47" fill="#38BDF8" font-family="monospace" font-size="18" font-weight="700">⏱ 00:24.8s</text>

    <!-- 4x4 Game Nodes -->
    <g transform="translate(48, 85)">
      <rect x="0" y="0" width="80" height="48" rx="14" fill="#3B82F6"/>
      <rect x="110" y="0" width="80" height="48" rx="14" fill="#1E3A8A"/>
      <rect x="220" y="0" width="80" height="48" rx="14" fill="#38BDF8"/>
      <rect x="330" y="0" width="80" height="48" rx="14" fill="#1E3A8A"/>

      <rect x="0" y="65" width="80" height="48" rx="14" fill="#1E3A8A"/>
      <rect x="110" y="65" width="80" height="48" rx="14" fill="#818CF8"/>
      <rect x="220" y="65" width="80" height="48" rx="14" fill="#1E3A8A"/>
      <rect x="330" y="65" width="80" height="48" rx="14" fill="#3B82F6"/>

      <rect x="0" y="130" width="80" height="48" rx="14" fill="#38BDF8"/>
      <rect x="110" y="130" width="80" height="48" rx="14" fill="#1E3A8A"/>
      <rect x="220" y="130" width="80" height="48" rx="14" fill="#3B82F6"/>
      <rect x="330" y="130" width="80" height="48" rx="14" fill="#818CF8"/>
    </g>

    <text x="24" y="305" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="500">Capgemini Deductive Reasoning &amp; Motion Challenge</text>
  </g>

  <!-- Overlay Header Tag -->
  <g transform="translate(80, 460)">
    <text x="0" y="40" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="30" font-weight="800" letter-spacing="-0.02em">Capgemini Game Aptitude Drill</text>
  </g>
</svg>
