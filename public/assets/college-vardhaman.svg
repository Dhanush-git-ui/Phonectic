<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="240" height="48" fill="none">
  <!-- Vardhaman Emblem: Monochrome Star Compass -->
  <g transform="translate(6, 4)">
    <circle cx="18" cy="18" r="17" stroke="#FFFFFF" stroke-width="1.8" stroke-opacity="0.9"/>
    <!-- 8-Point Compass Star -->
    <polygon points="18,5 21,15 31,18 21,21 18,31 15,21 5,18 15,15" fill="#FFFFFF" fill-opacity="0.95"/>
    <circle cx="18" cy="18" r="3" fill="#0B132B"/>
    <!-- Outer ring ticks -->
    <circle cx="18" cy="18" r="13" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.4"/>
  </g>
  <!-- Typography -->
  <text x="54" y="19" fill="#FFFFFF" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="15" letter-spacing="0.04em">VARDHAMAN</text>
  <text x="54" y="33" fill="#FFFFFF" fill-opacity="0.95" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="700" font-size="10.5" letter-spacing="0.03em">COLLEGE OF ENGINEERING</text>
</svg>