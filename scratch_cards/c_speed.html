<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 452px;
    height: 76px;
    background: transparent;
    overflow: hidden;
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 6px 10px;
    display: flex;
  }
  .capsule {
    width: 100%;
    height: 100%;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(20px);
    border-radius: 34px;
    border: 1.5px solid rgba(59, 130, 246, 0.45);
    box-shadow: 
      0 16px 32px -6px rgba(15, 23, 42, 0.16),
      0 0 20px rgba(37, 99, 235, 0.22),
      inset 0 1px 1px #ffffff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 12px 6px 12px;
  }
  .left-side {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .icon-disc {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    flex-shrink: 0;
  }
  .info-stack {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .badge-label {
    font-size: 10px;
    font-weight: 800;
    color: #2563eb;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .stat-line {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .stat-val {
    font-size: 20px;
    font-weight: 800;
    color: #0f172a;
    letter-spacing: -0.02em;
    font-family: 'JetBrains Mono', monospace;
    line-height: 1;
  }
  .stat-sub {
    font-size: 12px;
    font-weight: 700;
    color: #059669;
  }
  .solve-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: #0f172a;
    color: #ffffff;
    padding: 9px 16px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.01em;
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.25);
    flex-shrink: 0;
  }
  .pulse-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 8px #10b981;
  }
</style>
</head>
<body>
<div class="capsule">
  <div class="left-side">
    <div class="icon-disc">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    </div>
    <div class="info-stack">
      <div class="badge-label">⚡ Live Speed Math Drill</div>
      <div class="stat-line">
        <span class="stat-val">1.2s</span>
        <span class="stat-sub">99.8% Accuracy</span>
      </div>
    </div>
  </div>
  <div class="solve-btn">
    <span class="pulse-dot"></span>
    Solve Drill ➔
  </div>
</div>
</body>
</html>
