<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 525px;
    height: 456px;
    background: transparent;
    overflow: hidden;
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 16px 18px 20px 18px;
    display: flex;
  }
  .card {
    width: 100%;
    height: 100%;
    background: linear-gradient(155deg, #ffffff 0%, #fffefa 55%, #fff7eb 100%);
    border-radius: 36px;
    border: 1.5px solid rgba(254, 243, 199, 0.95);
    box-shadow: 
      0 26px 50px -12px rgba(15, 23, 42, 0.16),
      0 12px 26px -6px rgba(245, 158, 11, 0.14),
      inset 0 1px 2px #ffffff;
    padding: 24px 26px 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: -50px;
    right: -50px;
    width: 240px;
    height: 240px;
    background: radial-gradient(circle, rgba(245, 158, 11, 0.16) 0%, rgba(245, 158, 11, 0) 70%);
    border-radius: 50%;
    pointer-events: none;
  }
  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .streak-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: #fffbeb;
    border: 1px solid #fde68a;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12.5px;
    font-weight: 700;
    color: #b45309;
    letter-spacing: 0.02em;
  }
  .tier-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #0f172a;
    color: #ffffff;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
  }
  .metric-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-top: 1px;
  }
  .big-metric {
    font-size: 52px;
    font-weight: 800;
    color: #0f172a;
    letter-spacing: -0.03em;
    line-height: 1;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .fire-icon {
    font-size: 40px;
  }
  .growth-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: #ecfdf5;
    border: 1px solid #a7f3d0;
    padding: 5px 12px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 800;
    color: #059669;
  }
  .chart-box {
    background: #ffffff;
    border: 1px solid #f1f5f9;
    border-radius: 20px;
    padding: 12px 16px 10px;
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.03);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .chart-title-row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 700;
    color: #64748b;
  }
  .chart-bars {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    height: 74px;
    padding: 0 4px;
  }
  .bar-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    height: 100%;
    justify-content: flex-end;
  }
  .bar-stem {
    width: 24px;
    border-radius: 12px;
    background: #e2e8f0;
  }
  .bar-stem.active {
    background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    position: relative;
  }
  .bar-stem.active::after {
    content: '';
    position: absolute;
    top: 4px;
    left: 50%;
    transform: translateX(-50%);
    width: 6px;
    height: 6px;
    background: #ffffff;
    border-radius: 50%;
  }
  .bar-day {
    font-size: 10.5px;
    font-weight: 600;
    color: #94a3b8;
  }
  .bar-day.active {
    color: #2563eb;
    font-weight: 800;
  }
  .stat-pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .mini-stat-card {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    padding: 9px 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .mini-stat-val {
    font-size: 19px;
    font-weight: 800;
    color: #0f172a;
    font-family: 'JetBrains Mono', monospace;
    line-height: 1;
  }
  .mini-stat-label {
    font-size: 10.5px;
    font-weight: 600;
    color: #64748b;
  }
  .recruiter-strip {
    background: linear-gradient(90deg, #f0fdf4 0%, #ecfdf5 100%);
    border: 1px solid #bbf7d0;
    border-radius: 16px;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11.5px;
    font-weight: 700;
    color: #166534;
  }
  .recruiter-pills {
    display: flex;
    gap: 6px;
  }
  .recruiter-tag {
    background: #ffffff;
    border: 1px solid #86efac;
    padding: 2px 8px;
    border-radius: 8px;
    font-size: 10.5px;
    font-weight: 700;
    color: #15803d;
  }
</style>
</head>
<body>
<div class="card">
  <div class="top-row">
    <div class="streak-badge">
      🔥 Aptitude &amp; Coding Streak
    </div>
    <div class="tier-badge">
      👑 Diamond Tier
    </div>
  </div>

  <div class="metric-header">
    <div class="big-metric">48 Days <span class="fire-icon">🔥</span></div>
    <div class="growth-pill">▲ Top 0.4% Velocity</div>
  </div>

  <div class="chart-box">
    <div class="chart-title-row">
      <span>Placement Practice Velocity</span>
      <span style="color: #2563eb;">+38 Today</span>
    </div>
    <div class="chart-bars">
      <div class="bar-col">
        <div class="bar-stem" style="height: 36px;"></div>
        <span class="bar-day">M</span>
      </div>
      <div class="bar-col">
        <div class="bar-stem" style="height: 44px;"></div>
        <span class="bar-day">T</span>
      </div>
      <div class="bar-col">
        <div class="bar-stem" style="height: 40px;"></div>
        <span class="bar-day">W</span>
      </div>
      <div class="bar-col">
        <div class="bar-stem" style="height: 56px;"></div>
        <span class="bar-day">T</span>
      </div>
      <div class="bar-col">
        <div class="bar-stem" style="height: 48px;"></div>
        <span class="bar-day">F</span>
      </div>
      <div class="bar-col">
        <div class="bar-stem" style="height: 64px;"></div>
        <span class="bar-day">S</span>
      </div>
      <div class="bar-col">
        <div class="bar-stem" style="height: 54px;"></div>
        <span class="bar-day">S</span>
      </div>
      <div class="bar-col">
        <div class="bar-stem active" style="height: 72px;"></div>
        <span class="bar-day active">Today</span>
      </div>
    </div>
  </div>

  <div class="stat-pair">
    <div class="mini-stat-card">
      <div class="mini-stat-val">1,280+</div>
      <div class="mini-stat-label">Questions Solved (Quant &amp; DSA)</div>
    </div>
    <div class="mini-stat-card">
      <div class="mini-stat-val">9.6 / 10</div>
      <div class="mini-stat-label">Technical Mock Rating</div>
    </div>
  </div>

  <div class="recruiter-strip">
    <span>✔ Dream CTC Shortlist</span>
    <div class="recruiter-pills">
      <span class="recruiter-tag">Google SDE</span>
      <span class="recruiter-tag">Microsoft</span>
      <span class="recruiter-tag">Goldman</span>
    </div>
  </div>
</div>
</body>
</html>
