<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 618px;
    height: 111px;
    background: transparent;
    overflow: hidden;
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 8px 12px;
    display: flex;
  }
  .ribbon {
    width: 100%;
    height: 100%;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(20px);
    border-radius: 30px;
    border: 1.5px solid rgba(226, 232, 240, 0.95);
    box-shadow: 
      0 18px 36px -8px rgba(15, 23, 42, 0.15),
      0 0 20px rgba(16, 185, 129, 0.12),
      inset 0 1px 1px #ffffff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 18px;
  }
  .left-group {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .trophy-disc {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, #fef3c7, #fde68a);
    border: 1.5px solid #f59e0b;
    box-shadow: 0 4px 14px rgba(245, 158, 11, 0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
  }
  .text-stack {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .title {
    font-size: 15.5px;
    font-weight: 800;
    color: #0f172a;
    letter-spacing: -0.01em;
  }
  .sub {
    font-size: 12px;
    font-weight: 600;
    color: #64748b;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .tag {
    background: #f1f5f9;
    padding: 2px 7px;
    border-radius: 6px;
    font-size: 10.5px;
    color: #334155;
    font-weight: 700;
  }
  .right-metric {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #ecfdf5;
    border: 1.5px solid #a7f3d0;
    padding: 8px 16px;
    border-radius: 18px;
    color: #059669;
    flex-shrink: 0;
  }
  .metric-stack {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .metric-num {
    font-size: 17px;
    font-weight: 800;
    font-family: 'JetBrains Mono', monospace;
    line-height: 1.1;
  }
  .metric-label {
    font-size: 9.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    line-height: 1;
    color: #047857;
  }
</style>
</head>
<body>
<div class="ribbon">
  <div class="left-group">
    <div class="trophy-disc">🏆</div>
    <div class="text-stack">
      <div class="title">Campus Placement Offers Verified</div>
      <div class="sub">
        <span class="tag">Amazon</span>
        <span class="tag">Google</span>
        <span class="tag">Deloitte</span>
        <span class="tag">TCS Digital</span>
        • 24.5 LPA CTC
      </div>
    </div>
  </div>
  <div class="right-metric">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 6l-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/></svg>
    <div class="metric-stack">
      <div class="metric-num">4 Offers</div>
      <div class="metric-label">100% Conversion</div>
    </div>
  </div>
</div>
</body>
</html>
